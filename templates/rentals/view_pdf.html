{% extends 'base.html' %}

{% block title %}View PDF - {{ book.title }}{% endblock %}

{% block content %}
<div class="container-fluid py-3">
    <div class="row mb-3">
        <div class="col">
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a href="{% url 'dashboard' %}">Dashboard</a></li>
                    <li class="breadcrumb-item active">{{ book.title }}</li>
                </ol>
            </nav>
        </div>
    </div>
    
    <div class="card">
        <div class="card-header bg-primary text-white">
            <div class="row align-items-center">
                <div class="col-md-8">
                    <h4 class="mb-0"><i class="fas fa-file-pdf"></i> {{ book.title }}</h4>
                    <small>by {{ book.author }}</small>
                </div>
                <div class="col-md-4 text-end">
                    <span class="badge bg-light text-dark">
                        Expires: {{ rental.end_date|date:"M d, Y H:i" }}
                    </span>
                </div>
            </div>
        </div>
        <div class="card-body p-0">
            <div class="pdf-viewer" style="height: 80vh;">
                <iframe src="{{ book.pdf_file.url }}" width="100%" height="100%" style="border: none;"></iframe>
            </div>
        </div>
        <div class="card-footer">
            <div class="row">
                <div class="col-md-6">
                    <a href="{{ book.pdf_file.url }}" download class="btn btn-success">
                        <i class="fas fa-download"></i> Download PDF
                    </a>
                </div>
                <div class="col-md-6 text-end">
                    <a href="{% url 'dashboard' %}" class="btn btn-secondary">
                        <i class="fas fa-arrow-left"></i> Back to Dashboard
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
